    required_for_feature: 该功能需要管理员开通。

  # ---------- AI 记忆页面（modules/ai_workspace） ----------
  # 必须放在本文件里，不能另起一个 `ai_memories.zh-CN.yml`：spec 环境的 i18n
  # backend 是 I18n::Backend::LazyLoadable，它按**文件名**推断 locale
  # （spec/support/i18n_lazy_loading.rb 里的 LocaleExtractor 取 `_` 之前的整段），
  # 于是 `ai_memories.zh-CN.yml` 会被当成 `ai_memories.zh` 这个不存在的语言，
  # 中文在 spec 里永远查不到。`zh-CN.yml` 推断正确，开发和测试都能取到。
  #
  # ref.* 三个键的名字对应 AI::Memories::RefCard 产出的三个 tombstone 常量，
  # 取值刻意与那三个常量逐字相同：服务层用这三个常量说明"这条引用为什么解析不
  # 出来"，界面就必须原样显示出来——引用解析不出来时显示空白，正是这套设计要
  # 排除的那种失败。
  ai_workspace:
    memories:
      my:
        title: "记忆"
      project:
        title: "AI 记忆"
      table_title: "AI 记忆"
      never_used: "从未使用"
      used_times: "已使用 %{count} 次 · %{time}"
      no_refs: "没有关联对象"
      unknown_author: "未知作者"
      auto_captured: "%{label} · 自动捕获"
      source_session: "来源会话"
      review_banner:
        other: "有 %{count} 条记忆已过复核日期。"
      review_banner_action: "查看待复核"

      attributes:
        title: "标题"
        kind: "类型"
        body: "正文"
        body_caption: "写成关于项目的事实，不要写成对人的评判。"
        source: "来源"
        refs: "引用对象"
        review_after: "复核日期"
        review_after_caption: "日期，格式 YYYY-MM-DD。"
        last_used_at: "最近使用"

      scope:
        personal: "个人"
        project: "项目"
        global: "全局"

      kind:
        fact: "事实"
        preference: "偏好"
        decision: "决定"
        glossary: "术语"
        constraint: "约束"

      source_kind:
        user_explicit: "由你写入"
        model_proposed_user_confirmed: "模型提议，你已确认"
        compaction_auto: "自动"
        imported: "导入"

      # 取值必须与 AI::Memories::RefCard::{PERMISSION_DENIED, OBJECT_MISSING,
      # UNRESOLVABLE} 逐字相同。
      ref:
        permission_denied: "无权查看"
        object_missing: "对象已不存在"
        unresolvable: "无法解析引用"

      filter:
        search: "搜索"
        search_placeholder: "搜索标题与正文"
        scope: "作用域"
        any_scope: "全部作用域"
        apply: "筛选"
        clear: "清除筛选"

      action:
        edit: "编辑"
        delete: "删除"
        delete_confirm: "确定删除这条记忆？删除会留痕，且此后不再回放给模型。"

      edit:
        title: "编辑记忆"

      notice:
        updated: "记忆已更新。"
        deleted: "记忆已删除。"

      error:
        review_after_not_a_date: "复核日期必须是一个日期，格式 YYYY-MM-DD。"

      blank:
        title: "还没有记住任何东西"
        description: "有人写入记忆、或一次对话被压缩时捕获到值得保留的内容后，条目会出现在这里。任何内容都不会在不出现在本页面的情况下被模型使用。"

  # ---------- 菜单整理：概览 / 维基 / 工时与成本 ----------
  cost_reports_intro: 按人、按任务、按版本汇总工时与成本。
  cost_reports_menu:
    default_report: 成本报告
    time_entries: 工时记录
    by_version: 按版本汇总
