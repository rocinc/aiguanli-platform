# Project admins get every assignable permission already, which includes
# managing the assistant and seeing and appraising members (05 §6).
modules_permissions:
  assistant:
  - role: :default_role_member
    add:
    - :use_assistant
  - role: :default_role_reader
    add:
    - :use_assistant
