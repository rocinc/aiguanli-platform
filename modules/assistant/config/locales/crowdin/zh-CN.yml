    templates:
      work_package: "标题（动词＋对象）。描述：背景（为什么）、要做什么、不做什么。验收标准写成清单。建议估算，并注明参照的类似工作。建议负责人和版本，附理由。与现有工作包的关系。"
      user_story: "作为<角色>，我希望<能力>，以便<收益>。验收标准（假如／当／那么）。备注与待定问题。故事点估算，附参照故事。"
      test_cases: "编号用例：前置条件、步骤、预期结果。覆盖主流程、边界、异常和权限。标明每条用例验证哪一条验收标准。"
      wiki_page: "标题，一段话摘要，分节小标题，链接到所依据的工作包和决定，末尾写「最近核对」。"
      release_notes: "版本与日期。亮点（面向用户 2–4 行）。新增、改进、修复，每条一行并附 #编号。已知问题。升级说明。"
      phase_news: "阶段与日期。这个阶段交付了什么（面向读者 2–4 行）。阶段内完成的事，每条一行并附 #编号。还没完成的事和接下来放到哪里。下一步是什么。"
      minutes: "会议、日期、参会人。每个议程项：讨论要点（2–3 行）、决定、行动项（负责人、日期）。待定问题。下次会议。"
      status_report: "建议状态（正常／有风险／偏离），一句话说明理由。本周完成（附 #编号）。风险与建议应对。需要的决定及其后果。每句话都附依据。"
      reply: "先给答案，再给依据（原话或 #编号），最后说接下来怎么做。两到五句。"
      decision_record: "标题。状态。背景。决定（原话、决定人、日期和链接）。考虑过的方案。影响。被取代／取代了哪条。"
      onboarding: "项目一句话介绍和当前阶段。你接手的工作包，每个附「你需要知道的」。最近的关键决定及原因。该认识的人及原因。建议先读的维基。"
