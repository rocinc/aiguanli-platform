          what: "项目状态是正常，但有版本会错过目标日期。"
        deferred_still_in_version:
          title: "说了下版却还在本版"
          what: "有人说下版再做，工作包却还挂在本版上。"
        meeting_without_minutes:
          title: "会后没有纪要"
          what: "会议已经结束，却没有任何记录。"
        review_waiting:
          title: "等待评审"
          what: "PR 等待评审超过两个工作日。"
        systematic_underestimate:
          title: "总是被低估的工作"
          what: "某类工作一直比计划耗时长得多；在迭代开始前提出。"
        repeated_check_failure:
          title: "反复失败的检查"
          what: "同一个检查在多个 PR 上反复失败。"
        member_leaving:
          title: "带着未完成工作离开"
          what: "成员离开项目时手上还有工作或承诺；起草交接文档。"
        sprint_squeeze:
          title: "迭代中途加活"
          what: "运行中的迭代被加入新工作，会挤掉别的工作。"
        allocation_overbooked:
          title: "资源超订"
          what: "资源分配让某人超出了可用的工作时间。"
        stalled:
          title: "停滞的工作"
          what: "标为进行中，但好几天没有任何动静。"
        merged_not_advanced:
          title: "已合并但未推进"
          what: "拉取请求已合并，工作包还停在进行中。"
        meeting_decision_not_applied:
          title: "会议决定未落实"
          what: "会上决定的修改还没有落到工作包上。"
        third_reschedule:
          title: "第三次改期"
          what: "同一个日期改了三次，通常背后有值得说出来的原因。"
        absence_ripple:
          title: "请假带来的影响"
          what: "有人请假的那几天，正好压着别人在等的工作。"
        assigned_with_history:
          title: "接手有历史的工作"
          what: "新负责人需要知道的：关键决定、未答的问题、谁最懂。"
        date_change_cascade:
          title: "牵连别人的改期"
          what: "改了一个日期，带动了别人负责的工作。"
        idle_capacity:
          title: "有人有空档"
          what: "有人本迭代还有空闲时间，同时有工作在等。"
        idea_garden:
          title: "反复出现的想法"
          what: "好几个人都提到过同一个想法。"
        weak_decision:
          title: "依据薄弱的决定"
          what: "依据的数据很少，或者有人提出了疑问还没回应；会给出一个低成本的验证办法。"
        commitment_ladder:
          title: "答应过的事"
          what: "快到期的承诺，先轻轻提醒答应的人本人。"
        cross_project_reuse:
          title: "别的项目做过"
          what: "新建的工作别的项目已经做完了；负责人会看到是谁做的，并备好一句问对方的话。"
        overlap:
          title: "同一件事做了两遍"
          what: "不同的人手上有两个看起来是同一件事的工作包或维基页；会建议负责人关联起来，并介绍两人认识。"
        matchmaker:
          title: "别处有人懂"
          what: "一个问题等了 2 个工作日没人答，而别的项目里有人解决过；提问的人会收到备好的留言。"
        document_conflicts_decision:
          title: "文件与决定不一致"
          what: "新上传的文件涉及团队已有的决定；上传者会看到两边的原文并排，助理不判断谁对。"
        pre_mortem:
          title: "发布前的事前验尸"
          what: "版本发布前 5 个工作日，根据事实列出它可能失败的原因，作为下一场会议议程里的十分钟。"
        cross_sprint_pattern:
          title: "每个迭代都出同样的问题"
          what: "三个以上迭代反复出现缺陷集中在最后两天、或三成以上工作结转，或者回顾会说好的做法之后从没用过。发给负责人，并给下一场回顾会附议程项。"
        retro_follow_up:
          title: "上次回顾说要做的"
          what: "回顾会前一个工作日，列出上次说要做的事做没做，附前后的结转率和晚发现缺陷对比，作为议程第一项。"
        recognition:
          title: "值得在团队面前说的"
          what: "每周一次：按期发布的版本、挂了很久终于解决的问题、经常回答别人和维护维基的人。发给负责人，附一条简短的议程项。"
        meeting_prep:
          title: "会前的议程初稿"
          what: "会议开始前一小时内，主持人收到上一场说过的事和各自现状、参会人临近到期的工作，以及参会人之间等待回答的问题。"
        budget_brief:
          title: "月末和季末的预算简报"
          what: "每月或每季最后一个工作日：花费对照计划和进度，以及按当前速度预算何时用完。金额只给有预算查看权限的人。"
        phase_gate:
          title: "阶段关口前两周"
          what: "该阶段里仍未完成、已过期或无人负责的工作，以及完成日会越过关口多久，并建议把赶不上的工作移到下一阶段。"
        deadline_cluster:
          title: "同一天三个截止日"
          what: "提前一周私下告诉本人：跨项目同一天有三个以上截止日，并建议把最不急的一项挪到下一个空闲工作日。"
        weekly_timesheet:
          title: "周五的工时草稿"
          what: "每周最后一个工作日下午，根据每个人说过的话和做过的事起草本周工时，只由本人确认。"
        board_bottleneck:
          title: "看板上卡住的列"
          what: "某一列的卡片停留时间远长于其他列，或超过在制品上限；附最老的几张卡和各自卡在哪里。"
        calendar_crunch:
          title: "忙的一周后面跟着闲的一周"
          what: "私下告诉本人：下周的工作远超可用工时，而之后有一周有余量，并给出可以挪过去的那一项。"
        portfolio_health:
          title: "组合健康"
          what: "每周一次，只在组合或项目集上：哪些子项目自报的状态比事实乐观，谁被多个子项目同时超订。"
        assistant_arrival:
          title: "助理自我介绍"
          what: "助理启用时已在项目里的成员，会在项目概览看到一行：它会做什么、不会做什么；只在头两周出现。"
        away_digest:
          title: "你不在时"
          what: "离开三个工作日以上回来后，列出别人动了你的哪些工作、有哪些问题在等你、你答应的事现在排到哪天。"
        forum_request:
          title: "论坛里的需求"
          what: "论坛里有帖子提出改进需求时，给项目负责人起草一个工作包，并在帖子里回复已记下。"
        forum_followup:
          title: "回到论坛告知"
          what: "需求对应的工作完成或随版本发布时，回到原帖告诉提出的人。"
        request_weigh:
          title: "要不要答应一个请求"
          what: "回复请求前，告诉你按期答应会超出多少，并给出能放得下的日期，或有空的人。"
        assignee_change_load:
          title: "把工作交给别人"
          what: "改负责人时，告诉你新负责人到截止日前是否已排满，以及原负责人是否答应过关于它的事。"
        close_with_open_children:
          title: "关闭时还有没做完的"
          what: "关闭一个仍有未完成子项、未答问题或未合并 PR 的工作包时，列出这些，并可以一键改回或把子项一并关闭。"
        version_move_aside:
          title: "改工作包的版本"
          what: "把工作包放进版本时，如果它此前被说成要等下个版本，或它的日期晚于该版本的发布日，当场告诉你。"
        project_status_aside:
          title: "改项目状态"
          what: "设置项目状态时，如果数据显示项目比你设的更糟，当场告诉你依据。"
        sprint_move_aside:
          title: "拉进迭代"
          what: "在待办列表里把工作包拉进迭代时，当场告诉你迭代余量变成多少、哪几项放不下。"
        version_date_aside:
          title: "改版本日期"
          what: "在版本编辑页改发布日期时，当场告诉你有哪几项会排到新日期之后。"
        estimate_change_effect:
          title: "给工作包加时"
          what: "调高剩余工时时，告诉你它对负责人在当前迭代的余量或截止日前的影响，并给出能补回的调整。"
        possible_duplicate:
          title: "可能重复"
          what: "新建的工作包和项目里已有的一个说的是同一件事；创建人会在新工作包上看到那一个的状态和负责人，可以一键标为重复。"
        time_entry_anomaly:
          title: "不太对的工时"
          what: "某人一天在项目里登记的工时超过 14 小时；私下问本人，并列出那几条记录，因为只有本人能改。"
        said_change:
          title: "说到：改一下这个"
          what: "有人在评论或会议里说了要改的日期、负责人或状态；改动交给能决定的人确认，本人的小改动会直接生效，可以撤销。"
        missed_meeting:
          title: "你没参加的会"
          what: "会议关闭 10 分钟后，给受邀但没参会的人发三句话的摘要，并列出交给他的事。"
        meeting_unowned:
          title: "会上答应了却没人认领"
          what: "会议关闭后，议程项里有一件事没有人认领，会在这一项下面给主持人一行提示，列出两位可以接手的人，各附一个现成的工作包。"
        meeting_checklist:
          title: "议程里的清单转成工作"
          what: "助理写进议程的原因或规律清单，在这一项下面给一行提示，可以把每一条转成工作包，先不指派给任何人。"
        meeting_related_decision:
          title: "议程项和已有决定很接近"
          what: "会议进行中，议程项读起来像已有的某条决定，会给主持人一行提示，问是不是同一件事；是的话在该项下记一条沿用的结论。"
        wiki_stale:
          title: "维基页过时了"
          what: "页面上提到的工作包，在页面最后一次修改后已关闭、改到别的版本或被删除；发给最后修改页面的人，并附上没有任何链接指向的孤儿页。"
        sprint_planning_prep:
          title: "迭代计划会的议程初稿"
          what: "计划会前一个工作日，给主持人准备：每个人的可用工时、上个迭代剩下的事和原因、按优先级排得下的范围、其中的风险、多人提过的想法，以及一个迭代目标初稿。"
        said_dependency:
          title: "说到：这个要等那个"
          what: "有人说一项工作要等另一项；建议在两者之间建立关联。"
        said_split:
          title: "说到：拆开做"
          what: "有人说一个工作包应该拆分；建议拆成子工作包。"
        said_time_off:
          title: "说到：我要请假"
          what: "有人说自己要请假；本人的请假直接记录，可以撤销，替别人说的要等本人确认。"
        said_time_spent:
          title: "说到：花了几个小时"
          what: "有人说某件事花了多久；本人的工时直接记录，可以撤销。"
        said_risk:
          title: "说到：一个风险"
          what: "有人提到一个风险；建议记入风险登记，并说明会影响什么。"
        said_knowledge:
          title: "说到：值得记下的知识"
          what: "有人说了一个值得保留的术语或事实；建议补充到术语表或维基。"
        said_promise:
          title: "说到：答应了一个日期"
          what: "有人在自己的工作包上答应了一个日期，又选择了“先问我”时，问一句要不要记成截止日。"
