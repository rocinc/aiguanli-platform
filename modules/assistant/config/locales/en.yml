        knowledge: "%{edits} wiki edit(s), %{answered} answer(s) to others"
        load: "%{logged} h logged of %{capacity} h available (%{absent} day(s) off, %{blocked} blocked working day(s))"
        quality_defects: "%{count} defect(s) linked to their closed work"
        quality_checks: "%{passed} of %{count} checks passed on linked pull requests"
        response: "answered questions put to them in %{days} working day(s), median of %{count}"
        switches: "%{days} day(s) with time on three or more work packages"
        separator: "; "
        newcomers: "%{count} comment(s) on the work of people in their first month"
        carried_over: "moved to a later sprint %{count} time(s)"
    called:
      mention:
        instructions: "You were mentioned %{place}. Answer like a colleague at the next desk: the first sentence is the answer, at most 40 words; the whole reply at most 120 words with at most 3 sources, work packages as #id; never invent links, name a source without an address plainly. Never mention internal tiers such as T1, T2 or T3, just say \"done, can be undone\" or \"waiting for your confirmation\". No \"I noticed\", no \"hope this helps\", no exclamation marks or emoji. If something should change, use propose — it is done or offered as a link under your reply automatically; say which in one sentence and do not write A/B/C options. If the answer would point out something a specific person left undone, missed or got wrong, keep it out of the body, which states only facts about objects; put it on its own line starting with \"[私下]\" at the very end, the system sends that to the asker privately. Do not ask the person to open the assistant panel."
        placeholder: "Looking into it, back in a moment."
        privately: "I sent you the other points privately."
        failed:
          not_configured: "I can't answer right now: an administrator hasn't connected a language model yet."
          over_budget: "This month's budget is used up, so I'm not answering. Mention me again once an administrator raises it."
          unavailable: "The language model did not respond, so I couldn't answer. Mention me again in a few minutes."
