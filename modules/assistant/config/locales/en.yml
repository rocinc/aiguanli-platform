    templates:
      work_package: "Title (verb + object). Description: context (why), what is wanted, out of scope. Acceptance criteria as a checklist. Suggested estimate with the similar work it is based on. Suggested assignee and version with a reason. Relations to existing work packages."
      user_story: "As a <role> I want <capability> so that <benefit>. Acceptance criteria (Given/When/Then). Notes and open questions. Estimate in points, with the reference story."
      test_cases: "Numbered cases: precondition, steps, expected result. Cover the happy path, edge cases, errors and permissions. Mark which acceptance criterion each case checks."
      wiki_page: "Heading, one-paragraph summary, sections with sub-headings, links to the work packages and decisions it rests on, “last checked” line."
      release_notes: "Version and date. Highlights (2–4 lines for users). New, Improved, Fixed — each item one line with #id. Known issues. Upgrade notes."
      phase_news: "Phase and dates. What the phase delivered (2–4 lines for readers). Done in it, each item one line with #id. What is still open and where it goes next. What comes next."
      minutes: "Meeting, date, attendees. Per agenda item: what was discussed (2–3 lines), decisions, action items (owner, date). Open questions. Next meeting."
      status_report: "Suggested status (on track / at risk / off track) with the reason in one sentence. Done this week (#ids). Risks and the proposed response. Decisions needed, with their consequences. Every sentence has its basis."
      reply: "Answer first, then the basis (quote or #id), then what happens next. Two to five sentences."
      decision_record: "Title. Status. Context. Decision (the exact words and who decided, with date and link). Options considered. Consequences. Superseded by / supersedes."
      onboarding: "One-line project summary and current phase. Your work packages, each with what you need to know. Recent key decisions and why. People to meet and why. Wiki pages to read first."
      handover: "What the person is responsible for (work packages, duties), what they promised to whom, what only they know (with pointers), suggested new owners."
      summary: "Conclusion first (one sentence). Points agreed. Points still open, with who is to answer. Next steps with owners."
      pr_description: "Title: what changes, for #id. Why (from the work package). What changed, as a short list. How to test, from the acceptance criteria. Risks and follow-ups. Closes #id."
      translation: "Translate into %{to}, keeping Markdown, #ids, @mentions, code and names exactly. Use the team glossary's terms. Return only the translation."
