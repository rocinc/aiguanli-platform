          what: "When you set the project status and the figures show the project doing worse than that, you see why on the spot."
        sprint_move_aside:
          title: "Pulling work into a sprint"
          what: "When you drag a work package into a sprint, you see on the spot what room the sprint has left and which items no longer fit."
        version_date_aside:
          title: "Changing a version date"
          what: "When you edit a version's release date, you see on the spot which items would fall after the new date."
        estimate_change_effect:
          title: "More time on a work package"
          what: "When you raise the time left, you see what it does to the owner's room in the running sprint or before the due date, with the move that restores it."
        possible_duplicate:
          title: "Possibly a duplicate"
          what: "A new work package reads like one already in the project; whoever created it sees the older one, its state and owner, and can mark it a duplicate."
        time_entry_anomaly:
          title: "Logged time that cannot be right"
          what: "One person's time in a project adds up to more than 14 hours on a day; asked privately, with the entries listed, since only they can correct it."
        said_change:
          title: "Said: change this"
          what: "Someone said in a comment or meeting that a date, owner or status should change; it goes to whoever may decide, and a small change to their own work takes effect at once and can be undone."
        missed_meeting:
          title: "A meeting you missed"
          what: "Ten minutes after a meeting is closed, those invited who did not attend get three sentences on what happened and what is now theirs."
        meeting_unowned:
          title: "A promise at a meeting nobody took"
          what: "After a meeting is closed, an agenda item whose promise has no one yet gets one line for the host with two people who could take it, each a work package ready to create."
        meeting_checklist:
          title: "A list on the agenda becomes work"
          what: "Under an agenda item the assistant wrote as a list of causes or patterns, one line offers to turn every entry into a work package, assigned to no one."
        meeting_related_decision:
          title: "An agenda item that repeats a decision"
          what: "While a meeting runs, an agenda item that reads like a decision on record gets one line for the host asking whether it is the same matter, and a note under the item if so."
        wiki_stale:
          title: "A wiki page out of date"
          what: "Work packages a page names were closed, moved to another version or deleted after the page was last edited; goes to its last editor, with pages nothing links to."
        sprint_planning_prep:
          title: "Agenda draft for sprint planning"
          what: "The working day before planning, its host gets each person's hours, what the last sprint left open and why, the scope that fits by priority, the risks in it, ideas several people raised and a first sprint goal."
        said_dependency:
          title: "Said: this waits for that"
          what: "Someone said one piece of work must wait for another; a relation between the two is offered."
        said_split:
          title: "Said: split this up"
          what: "Someone said a work package should be split; the parts are offered as child work packages."
        said_time_off:
          title: "Said: I'll be away"
          what: "Someone said they will be off; their own time off is recorded at once and can be undone, anyone else's waits for them."
        said_time_spent:
          title: "Said: this took me hours"
          what: "Someone said how long something took; their own time entry is logged at once and can be undone."
        said_risk:
          title: "Said: a risk"
          what: "Someone named a risk; it is offered for the risk register with what it would affect."
        said_knowledge:
          title: "Said: how things are"
          what: "A term or fact worth keeping was said; it is offered for the glossary or the wiki."
        said_promise:
          title: "Said: promised a date"
          what: "Someone promised a date on their own work and chose to be asked first; it asks whether to put it down as the due date."
