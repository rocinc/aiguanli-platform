# 演示数据主干（backbone）目录：本步骤新增的每个工作包一条。第一版，后续改动会通知 main。
#
# 约定
# - id 固定（201 起），重建后编号不变；其余步骤既可按 id 引用，也可按 subject 查找（subject 在 quill 内唯一）。
# - 既有 #42–#121 编号不变；#122–#124 属于 research-notes 项目，不动。
# - 日期全部相对：sprint 内用 s/d（迭代内第几个工作日，0=迭代第一天、9=最后一天）；backlog 用 born（相对本周一 M 的天数）。
# - type: epic feature story task bug milestone；status: 终态（closed=已关闭）。
# - points 只落在 story 与 bug 上（斐波那契）；task/feature/epic 不挂点数（其工时在 est）。
# - est=估算工时(小时)，actual=实际工时(小时，仅已关闭条目)。工时记录(TimeEntry)由 ledger 依据 actual 生成，backbone 不造。
# - Ben 的 RAG/续写类任务 actual≈1.6×est（标 T3，共 12 个样本）；其余人 0.9–1.2×。
# - 速度：S1 18、S2 22、S3 25（本文件）；S4 27、S5 31（既有条目补点，见 existing）；S6 承诺 38 完成 29。
# - 迭代日期：S1 M-77…M-66、S2 M-63…M-52、S3 M-49…M-38（S4 起沿用既有 M-35…）。
# - 版本：v0.9 内部预览版（S1–S3 历史条目，生效日 M-38，已关闭）；既有 21=v1.1 商业化版(M+11)、22=v2.0 团队版(M+67)。

